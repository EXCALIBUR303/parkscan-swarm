[project]
name = "parkscan-agent"
version = "0.1.0"
description = "Robot autonomy: task state machine, lane-graph navigation, battery policy, docking"
requires-python = ">=3.12,<3.13"
dependencies = ["parkscan-core", "numpy==2.5.2", "aiomqtt==2.5.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parkscan_agent"]
