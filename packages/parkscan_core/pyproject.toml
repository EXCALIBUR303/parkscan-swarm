[project]
name = "parkscan-core"
version = "0.1.0"
description = "Backend-agnostic types, world interface and lot geometry for ParkScan Swarm"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.2",
  "pydantic==2.13.5",
  "pyyaml==6.0.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parkscan_core"]
