[project]
name = "parkscan-perception"
version = "0.1.0"
description = "Detector interface, deterministic simulated detector, and monocular flat-ground geolocation"
requires-python = ">=3.12,<3.13"
dependencies = ["parkscan-core", "numpy==2.5.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parkscan_perception"]
