[project]
name = "parkscan-coord"
version = "0.1.0"
description = "Swarm coordinator: zone allocation, resource leases with fencing, failure detection and recovery"
requires-python = ">=3.12,<3.13"
dependencies = ["parkscan-core", "parkscan-agent", "numpy==2.5.2", "scipy==1.18.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parkscan_coord"]
