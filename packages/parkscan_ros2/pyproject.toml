[project]
name = "parkscan-ros2"
version = "0.1.0"
description = "Ros2WorldBackend: the ros2-gz backend, per ADR-0008. See docs/adr/0008-ros2-backend-bridge-design.md."
requires-python = ">=3.12,<3.13"
dependencies = ["parkscan-core", "numpy==2.5.2", "paho-mqtt>=2.1,<3"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parkscan_ros2"]
