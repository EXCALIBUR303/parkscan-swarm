[project]
name = "parkscan-sim"
version = "0.1.0"
description = "sim-lite: deterministic 2D kinematic simulator implementing WorldBackend"
requires-python = ">=3.12,<3.13"
dependencies = ["parkscan-core", "numpy==2.5.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parkscan_sim"]
