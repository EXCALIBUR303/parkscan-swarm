[project]
name = "parkscan-runner"
version = "0.1.0"
description = "Process that owns the simulation loop, ticks robot agents, and publishes telemetry over MQTT"
requires-python = ">=3.12,<3.13"
dependencies = [
  "parkscan-core",
  "parkscan-sim",
  "parkscan-agent",
  "parkscan-ros2",
  "aiomqtt==2.5.1",
  "structlog==26.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parkscan_runner"]
