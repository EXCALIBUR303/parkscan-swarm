[project]
name = "parkscan-api"
version = "0.1.0"
description = "FastAPI backend: MQTT ingest, PostGIS storage, WebSocket fan-out"
requires-python = ">=3.12,<3.13"
dependencies = [
  "parkscan-core",
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "pydantic==2.13.5",
  "pydantic-settings==2.15.0",
  # The [asyncio] extra is MANDATORY. Bare `sqlalchemy` omits greenlet on macOS
  # arm64 (its marker tests for 'aarch64'; macOS reports 'arm64') and every async
  # query then fails at runtime with an opaque greenlet error.
  "sqlalchemy[asyncio]==2.0.52",
  "asyncpg==0.31.0",
  "geoalchemy2==0.20.0",
  "alembic==1.19.1",
  "aiomqtt==2.5.1",
  "structlog==26.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parkscan_api"]
