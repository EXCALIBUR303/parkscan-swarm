# Alembic configuration for the ParkScan Swarm API.
#
# sqlalchemy.url is deliberately EMPTY: the URL comes from Settings (DATABASE_URL in
# .env) inside migrations/env.py, so there is exactly one place that knows how to
# reach the database. A URL duplicated here would drift from the app's.
[alembic]
script_location = migrations
prepend_sys_path = src
path_separator = os
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
