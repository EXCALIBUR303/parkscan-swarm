[project]
name = "parkscan-eval"
version = "0.1.0"
description = "Evaluation harness: geolocation error vs range, horizon rejection, pipeline latency, detector-contract conformance"
requires-python = ">=3.12,<3.13"
dependencies = [
  "parkscan-core",
  "parkscan-sim",
  "parkscan-perception",
  "numpy==2.5.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parkscan_eval"]
