# ParkScan Swarm - authored lot specification (metric, lot frame).
#
# Units: metres. Frame: REP-103, +x east, +y north, origin at the south-west corner.
# Generated GeoJSON: `make lot` -> sim/lot/lot.geojson. Edit THIS file, never that one.
#
# The origin is latitude 0, longitude 0 on purpose. That is an obviously synthetic
# location in the Gulf of Guinea, so no reader can mistake this lot for a real address,
# and it also gives zero convergence distortion (cos(lat0) == 1).
#
# Layout (150 m x 100 m):
#   * 12 zones tile the lot exactly: 3 columns of 50 m x 4 bands of 25 m, no gaps,
#     no overlap (acceptance criterion C8). A zone is a parking sub-row *plus* the
#     drive aisle that serves it, because potholes live on the driving surface -- the
#     aisle is the part that actually needs inspecting.
#   * Within each 25 m band: 2 m kerb, a 6 m drive aisle (y+2..y+8), a 5 m deep stall
#     row (y+8..y+13) holding 10 stalls at a 2.5 m pitch, then 12 m of circulation and
#     landscaping. 12 zones x 10 stalls = 120 parking spaces.
#   * sweep_length_m = passes * pass_length + (passes - 1) * lane_spacing
#     = 3 * 40.0 + 2 * 2.0 = 124.0 m.
#     An odd number of passes means the sweep finishes at the exit waypoint rather
#     than back at the entry. This is authored geometry, not an optimised path.
#   * Exactly 2 charging bays for 3 robots. Fewer bays than robots is deliberate:
#     bay contention has to be real for the lease/fencing/queueing code to mean
#     anything (see docs/ARCHITECTURE.md section 4).

name: "ParkScan synthetic lot A"

origin:
  lat: 0.0
  lon: 0.0

size_m:
  w: 150.0
  h: 100.0

