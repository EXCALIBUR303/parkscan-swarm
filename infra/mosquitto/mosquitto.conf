# Local development broker.
#
# Mosquitto 2.x defaults allow_anonymous to FALSE the moment a config file with
# listeners is supplied. Without the explicit line below every client is rejected
# with no obvious cause. This is a DEV-ONLY setting; production would use
# per-robot credentials + TLS (see docs/API_CONTRACT.md).
listener 1883
protocol mqtt

listener 9001
protocol websockets

allow_anonymous true
persistence false
log_dest stdout
log_type warning
log_type error
